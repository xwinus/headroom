name: headroom
version: 0.5.0.0
homepage: https://github.com/xwinus/headroom
license: BSD-3-Clause
license-file: LICENSE
author: Vaclav Svejcar
maintainer: vaclav.svejcar@gmail.com
copyright: Copyright (c) 2019-2026 Vaclav Svejcar
github: xwinus/headroom
category: Utils
synopsis: License Header Manager
description: >
  Headroom adds, updates, checks, and removes license and copyright headers in
  source code files. Define headers as Mustache templates, keep their variables
  in a YAML configuration file, and apply them consistently across your project.
  Headroom includes templates for popular open source licenses and
  conservatively recognizes legacy headers from their license content.

extra-source-files:
  - CHANGELOG.md
  - LICENSE
  - README.md
  - embedded/**
  - embedded/license/*/*.mustache
  - test-data/*
  - test-data/code-samples/*/*
  - test-data/configs/*
  - test-data/templates/*
  - test-data/test-traverse/*
  - test-data/test-traverse/foo/*
  - test-data/test-traverse/foo/bar/*
  - test-data/updater/*

dependencies:
  - base >= 4.7 && < 5
  - optparse-applicative
  - rio

ghc-options:
  - -optP-Wno-nonportable-include-path
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Werror=incomplete-patterns

executables:
  headroom:
    main: Main.hs
    source-dirs: app
    dependencies:
      - headroom
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

library:
  source-dirs: src
  generated-other-modules: Paths_headroom
  dependencies:
    - aeson
    - either
    - extra
    - file-embed
    - generic-data
    - http-client
    - http-types
    - microlens
    - microlens-aeson
    - microlens-th
    - modern-uri
    - mtl
    - mustache >=2.3.1
    - pcre-light
    - pcre-heavy
    - persistent
    - persistent-sqlite
    - req
    - string-interpolate
    - template-haskell
    - time
    - vcs-ignore >= 0.1 && < 0.2
    - yaml

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - aeson
      - headroom
      - hspec
      - modern-uri
      - mustache
      - mtl
      - pcre-light
      - persistent-sqlite
      - process
      - QuickCheck
      - string-interpolate
      - time
      - vcs-ignore >= 0.1 && < 0.2
    build-tools:
      - hspec-discover
      - headroom:headroom
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

  doctest:
    main: Main.hs
    source-dirs: doctest
    dependencies:
      - doctest

benchmarks:
  source-walker:
    main: SourceWalker.hs
    source-dirs: benchmark
    dependencies:
      - criterion >= 1.6.4 && < 1.7
      - headroom
